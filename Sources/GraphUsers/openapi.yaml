openapi: "3.1.0"
info:
  title: Microsoft Graph – Users
  version: "1.0"
  description: |
    Copied from the official Microsoft Graph OpenAPI specs.
    v1.0 source: https://github.com/microsoftgraph/msgraph-metadata/blob/master/openapi/v1.0/openapi.yaml
    beta source:  https://github.com/microsoftgraph/msgraph-metadata/blob/master/openapi/beta/openapi.yaml
    Contains only the list-users endpoints (v1.0 and beta).
servers:
  - url: https://graph.microsoft.com

paths:
  /v1.0/users:
    get:
      tags:
        - users.user
      summary: List users
      description: Retrieve a list of user objects.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/user-list?view=graph-rest-1.0
      operationId: users.user.ListUser
      parameters:
        - name: ConsistencyLevel
          in: header
          description: Indicates the requested consistency level.
          schema:
            type: string
        - name: $select
          in: query
          description: Select properties to be returned
          style: form
          explode: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: $filter
          in: query
          description: Filter items by property values
          schema:
            type: string
        - name: $top
          in: query
          description: Show only the first n items
          schema:
            minimum: 0
            type: integer
        - name: $skiptoken
          in: query
          description: >
            Opaque pagination token returned in @odata.nextLink.
            Not in the official spec but required to follow pagination links.
          schema:
            type: string
      responses:
        2XX:
          description: Retrieved collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/microsoft.graph.userCollectionResponse"
        4XX:
          $ref: "#/components/responses/error"
        5XX:
          $ref: "#/components/responses/error"
      x-ms-pageable:
        nextLinkName: "@odata.nextLink"
        operationName: listMore
      x-ms-docs-operation-type: operation

  /beta/users:
    get:
      tags:
        - users.user
      summary: List users (beta)
      description: >
        Retrieve a list of user objects.
        This API also returns agentUser objects.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/user-list?view=graph-rest-beta
      operationId: users.user.ListUserBeta
      parameters:
        - name: ConsistencyLevel
          in: header
          description: Indicates the requested consistency level.
          schema:
            type: string
        - name: $select
          in: query
          description: Select properties to be returned
          style: form
          explode: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: $skiptoken
          in: query
          description: Opaque pagination token returned in @odata.nextLink.
          schema:
            type: string
      responses:
        2XX:
          description: Retrieved collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/microsoft.graph.betaUserCollectionResponse"
        4XX:
          $ref: "#/components/responses/error"
        5XX:
          $ref: "#/components/responses/error"
      x-ms-pageable:
        nextLinkName: "@odata.nextLink"
        operationName: listMore
      x-ms-docs-operation-type: operation

