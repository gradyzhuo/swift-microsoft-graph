          nullable: true
        usageLocation:
          type: string
          nullable: true
        userPrincipalName:
          type: string
          description: The user principal name (UPN) of the user.
          nullable: true
        userType:
          type: string
          nullable: true
        assignedLicenses:
          type: array
          items:
            $ref: "#/components/schemas/microsoft.graph.assignedLicense"
        assignedPlans:
          type: array
          items:
            $ref: "#/components/schemas/microsoft.graph.assignedPlan"
        provisionedPlans:
          type: array
          items:
            $ref: "#/components/schemas/microsoft.graph.provisionedPlan"
        proxyAddresses:
